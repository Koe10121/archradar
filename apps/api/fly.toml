# Fly.io configuration for ArchRadar FastAPI Backend
# Set secrets before deploying:
#   fly secrets set DATABASE_URL="postgresql+asyncpg://..." GEMINI_API_KEY="..." GITHUB_WEBHOOK_SECRET="..." CORS_ORIGINS="https://your-app.vercel.app"

app = "archradar-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "uv run --no-dev alembic upgrade head"

[env]
  ENVIRONMENT = "production"
  LOG_LEVEL = "INFO"
  PORT = "8000"
  SEED_DEMO_ON_STARTUP = "true"
  GEMINI_MODEL = "gemini-2.5-flash"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/health"
